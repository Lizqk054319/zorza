pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
    // wersja Loom zależy od wersji Minecrafta (gradle.properties: loom_version)
    plugins {
        id 'fabric-loom' version "${loom_version}"
    }
}
rootProject.name = 'zorza-client'
