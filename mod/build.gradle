plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "mc", project.minecraft_version
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "mc": project.minecraft_version, "java": project.findProperty("java_version") ?: "21"
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = (project.findProperty("java_version") ?: "21") as int
    it.options.encoding = "UTF-8"
    it.options.compilerArgs += ["-Xmaxerrs", "2000"]
}

java {
    def jv = JavaVersion.toVersion(project.findProperty("java_version") ?: "21")
    sourceCompatibility = jv
    targetCompatibility = jv
}

// Testy z prawdziwym Minecraftem w CI – robią zrzuty ekranu menu Zorzy
if ((project.findProperty("gametest") ?: "true") == "true") fabricApi {
    configureTests {
        createSourceSet = true
        modId = "zorza-gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

// Starsze wersje (bez klientowych gametestów Fabric API): krótki test dymny –
// gra startuje, mod sprawdza wszystkie mixiny, robi zrzuty i sama się zamyka.
loom {
    runs {
        client {
            if (project.hasProperty("smoke")) {
                vmArg "-Dzorza.smoke=" + file("build/smoke").absolutePath
                programArgs "--width", "1920", "--height", "1080"
            }
        }
    }
}
