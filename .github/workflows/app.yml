name: Build Zorza Visuals app

on:
  push:
    paths:
      - "launcher.py"
      - "ui/**"
      - "packaging/**"
      - "requirements.txt"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pyinstaller -r requirements.txt
      - name: Build exe (PyInstaller)
        run: pyinstaller --noconfirm --windowed --name "Zorza Visuals" --icon packaging/zorza.ico --add-data "ui;ui" --collect-all minecraft_launcher_lib launcher.py
      - name: Smoke test (start without window, ask for state)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Zorza Visuals\Zorza Visuals.exe" -ArgumentList "--no-window" -PassThru
          Start-Sleep -Seconds 8
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:47615/api/state
          Write-Host ($r.Content.Substring(0, 120))
          $h = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:47615/
          if ($h.Content -notmatch "Zorza") { throw "UI not served" }
          Stop-Process -Id $p.Id -Force
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $env:ZORZA_VERSION = (Select-String -Path launcher.py -Pattern 'WERSJA_CLIENTA = "(.+)"').Matches[0].Groups[1].Value
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc packaging\installer.iss
          Compress-Archive -Path "dist\Zorza Visuals" -DestinationPath "dist-installer\ZorzaVisuals-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: zorza-app
          path: dist-installer/*
      - name: Publish release "app-latest"
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest dist-installer/ZorzaSetup.exe dist-installer/ZorzaVisuals-portable.zip \
            --title "Zorza Visuals – instalator" --target "$GITHUB_SHA" \
            --notes "Pobierz ZorzaSetup.exe i uruchom. Windows może pokazać ostrzeżenie SmartScreen: kliknij 'Więcej informacji' -> 'Uruchom mimo to'."
