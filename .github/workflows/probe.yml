name: probe
on: push
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out
          for s in dynamic-fps krypton scalablelux fastquit noisium c2me-fabric debugify clumps lazy-language-loader cull-leaves ksyxis language-reload sodium-leaf-culling; do
            curl -s "https://api.modrinth.com/v2/project/$s" | jq -c '{slug,id,title,downloads}' > out/$s.json || true
            curl -s -G "https://api.modrinth.com/v2/project/$s/version" --data-urlencode 'game_versions=["1.21.4"]' --data-urlencode 'loaders=["fabric"]' | jq -c '{n:length, v:(.[0].version_number), deps:[.[0].dependencies[]? | select(.dependency_type=="required") | .project_id], inc:[.[0].dependencies[]? | select(.dependency_type=="incompatible") | .project_id]}' >> out/$s.json || true
          done
          git config user.name ci; git config user.email ci@x
          git add out; git commit -qm out; git push origin HEAD:ci-probe
