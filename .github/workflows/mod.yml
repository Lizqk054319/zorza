name: Build Zorza Client mod

on:
  push:
    paths:
      - "mod/**"
      - ".github/workflows/mod.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Build
        working-directory: mod
        run: gradle build --no-daemon --stacktrace
      - name: Prepare jar
        run: |
          VER=$(grep '^mod_version=' mod/gradle.properties | cut -d= -f2)
          MC=$(grep '^minecraft_version=' mod/gradle.properties | cut -d= -f2)
          cp "mod/build/libs/zorza-client-${VER}.jar" "zorza-client-${MC}.jar"
          echo "JAR=zorza-client-${MC}.jar" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: zorza-client
          path: ${{ env.JAR }}
      - name: Publish release "mod-latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mod-latest --yes --cleanup-tag || true
          gh release create mod-latest "$JAR" --title "Zorza Client mod (najnowszy)" \
            --notes "Automatycznie zbudowany mod Zorza Client. Launcher pobiera go sam." --target "$GITHUB_SHA"
