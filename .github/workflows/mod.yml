name: Build Zora Client mod

on:
  push:
    paths:
      - "mod/**"
      - "tools/preprocess.py"
      - "tools/resolve_versions.py"
      - ".github/workflows/mod.yml"
  workflow_dispatch:

permissions:
  contents: write

# jedno budowanie naraz – żeby dwa wydania się nie nadpisywały
concurrency:
  group: mod-build
  cancel-in-progress: false

jobs:
  # Osobny plik moda na każdą wersję Minecrafta. Każda wersja musi się zbudować
  # i uruchomić w prawdziwej grze (gametest albo test dymny), inaczej nie trafia do wydania.
  mod:
    strategy:
      fail-fast: false
      matrix:
        mc: ["1.21.4", "1.21.5", "1.21.3", "1.21.1", "1.20.6", "1.21.8", "1.21.11", "1.20.1", "1.20.4", "1.21.10"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wersje dla Minecraft ${{ matrix.mc }}
        run: |
          python3 tools/resolve_versions.py "${{ matrix.mc }}" mod/gradle.properties
          python3 tools/preprocess.py "${{ matrix.mc }}" mod/src
          grep -E "gametest=" mod/gradle.properties | sed 's/^/GT_/; s/gametest/FLAG/' >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VER }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VER }}
      - name: Dark GUI pack (z tekstur Minecrafta)
        run: |
          pip install --quiet pillow
          (cd mod && gradle --no-daemon -q help > /dev/null)
          JAR=$(find ~/.gradle/caches/fabric-loom -path "*${{ matrix.mc }}*" -name "minecraft-client.jar" | head -1)
          [ -z "$JAR" ] && JAR=$(find ~/.gradle/caches/fabric-loom -name "minecraft-client.jar" | head -1)
          python3 tools/dark_gui.py "$JAR" mod/src/main/resources/resourcepacks/zora_dark_gui
      - name: Sygnatury klas (do przenoszenia między wersjami)
        run: tools/sigs.sh /tmp/shots/sigs "${{ matrix.mc }}" || true
      - name: Build
        working-directory: mod
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee /tmp/build.log || { grep -A4 "error:" /tmp/build.log | grep -v "^--" > build/compile-errors.txt 2>/dev/null || { mkdir -p build; grep -A4 "error:" /tmp/build.log > build/compile-errors.txt; }; exit 1; }
      - name: Install virtual display
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb mesa-utils libgl1-mesa-dri
      - name: Gametest (gra z modem)
        if: env.GT_FLAG == 'true'
        working-directory: mod
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1920x1080x24" gradle runClientGameTest --no-daemon --stacktrace
      - name: Test dymny (gra z modem)
        if: env.GT_FLAG != 'true'
        working-directory: mod
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf "onboardAccessibility:false\nnarrator:0\n" > run/options.txt
          timeout 600 xvfb-run -a -s "-screen 0 1920x1080x24" gradle runClient -Psmoke --no-daemon --stacktrace || true
          cat build/smoke/result.txt
          grep -q "SMOKE OK" build/smoke/result.txt
      - name: Prepare jar
        run: |
          VER=$(grep '^mod_version=' mod/gradle.properties | cut -d= -f2)
          cp "mod/build/libs/zorza-client-${VER}.jar" "zorza-client-${{ matrix.mc }}.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.mc }}
          path: zorza-client-${{ matrix.mc }}.jar
      - name: Zrzuty ekranu na gałąź ci-screenshots
        if: always()
        run: |
          mkdir -p /tmp/shots
          cp mod/build/compile-errors.txt /tmp/shots/ 2>/dev/null || true
          cp -r mod/build/run/clientGameTest/screenshots/. /tmp/shots/ 2>/dev/null || true
          cp -r mod/build/smoke/. /tmp/shots/ 2>/dev/null || true
          cp mod/build/run/clientGameTest/logs/latest.log /tmp/shots/ 2>/dev/null || cp mod/run/logs/latest.log /tmp/shots/ 2>/dev/null || true
          B=ci-screenshots; [ "${{ matrix.mc }}" != "1.21.4" ] && B="ci-screenshots-${{ matrix.mc }}"
          cd /tmp/shots && git init -q -b "$B" && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "screenshots ${GITHUB_SHA}" || exit 0
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$B"

  # Wydanie: nowe pliki dla wersji, które przeszły test; dla pozostałych zostaje poprzedni działający plik
  publish:
    needs: [mod]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          merge-multiple: true
          path: new
      - name: Publish release "mod-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls new || true
          [ -n "$(ls new 2>/dev/null)" ] || { echo "Żadna wersja nie przeszła testu"; exit 1; }
          mkdir -p old && gh release download mod-latest -D old -p "zorza-client-*.jar" || true
          for f in old/*.jar; do [ -e "$f" ] && [ ! -e "new/$(basename "$f")" ] && cp "$f" new/; done
          ls -la new
          gh release delete mod-latest --yes --cleanup-tag || true
          gh release create mod-latest new/*.jar --title "Zora Client mod (najnowszy)" \
            --notes "Automatycznie zbudowany mod Zora Client – osobny plik na każdą wersję Minecrafta. Launcher pobiera go sam." --target "$GITHUB_SHA"
